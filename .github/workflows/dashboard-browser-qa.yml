name: Dashboard browser QA

on:
  push:
    branches:
      - feat/institutional-dashboard-design
    paths:
      - "dashboard/**"
      - "tests/test_dashboard_browser.cjs"
      - ".github/workflows/dashboard-browser-qa.yml"
  pull_request:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "tests/test_dashboard_browser.cjs"
      - ".github/workflows/dashboard-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium responsive, keyboard and API fault tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Run isolated dashboard browser tests
        run: node --test tests/test_dashboard_browser.cjs
