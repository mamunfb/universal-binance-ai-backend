name: Cloudflare CORS QA

on:
  push:
    branches:
      - fix/cloudflare-cors-current-backend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cors-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run CORS configuration regression tests
        run: pytest -q tests/test_cors_configuration.py
      - name: Lint CORS implementation and tests
        run: ruff check backend/app/config.py tests/test_cors_configuration.py
