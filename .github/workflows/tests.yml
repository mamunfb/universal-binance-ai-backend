name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Apply PostgreSQL migrations
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import psycopg

          with psycopg.connect(os.environ["TEST_DATABASE_URL"], autocommit=True) as connection:
              for migration in sorted(Path("migrations").glob("*.sql")):
                  connection.execute(migration.read_text(encoding="utf-8"), prepare=False)
                  print(f"Applied {migration}")
          PY
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory
          html = Path("dashboard/index.html").read_text()
          assert html.count("<script>") == 1 and html.count("</script>") == 1
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          with TemporaryDirectory() as directory:
              file = Path(directory) / "dashboard.js"
              file.write_text(script)
              subprocess.run(["node", "--check", str(file)], check=True)
          PY
      - name: Build production Docker image
        run: docker build --tag universal-binance-ai-backend:test .
      - name: Run tests
        run: pytest -q
