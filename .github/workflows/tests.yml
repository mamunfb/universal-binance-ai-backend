name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Run Ruff lint
        run: ruff check --select E4,E7,E9,F backend/app/main.py backend/app/providers/news_rss.py backend/app/services/futures_scanner.py backend/app/services/market_scanner.py tests/test_api_error_envelopes.py tests/test_futures_scanner.py tests/test_market_scanner.py tests/test_news_intelligence.py tests/test_dashboard_quality_markup.py
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory
          html = Path("dashboard/index.html").read_text()
          assert html.count("<script>") == 1 and html.count("</script>") == 1
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          with TemporaryDirectory() as directory:
              file = Path(directory) / "dashboard.js"
              file.write_text(script)
              subprocess.run(["node", "--check", str(file)], check=True)
          PY
      - name: Run tests
        run: pytest -q
