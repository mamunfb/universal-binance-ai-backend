name: Backend and dashboard tests

on:
  push:
    branches: [main, feat/institutional-dashboard-design]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests and dashboard JavaScript validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runner toolchain
        run: |
          python --version
          node --version
          npm --version
          python -m pip --version

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Validate dashboard document and script references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("dashboard/index.html").read_text(encoding="utf-8")
          assert "<!doctype html>" in html.lower(), "Dashboard HTML doctype is missing"
          assert 'id="app-shell"' in html or 'class="app-shell"' in html, "Dashboard shell is missing"
          scripts = re.findall(r'<script\\b[^>]*src=["\\']([^"\\']+)["\\'][^>]*>', html, flags=re.I)
          assert "./chart.js" in scripts, "dashboard/chart.js is not referenced"
          assert "./app.js" in scripts, "dashboard/app.js is not referenced"
          for script in scripts:
              if script.startswith(("http://", "https://")):
                  continue
              path = (Path("dashboard") / script).resolve()
              assert path.is_file(), f"Referenced dashboard script is missing: {script}"
          print(f"Validated dashboard HTML and {len(scripts)} script references")
          PY

      - name: Check dashboard JavaScript syntax
        run: |
          node --check dashboard/app.js
          node --check dashboard/chart.js

      - name: Run Python test suite
        run: python -m pytest -q
