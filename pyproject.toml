[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-binance-ai-backend"
version = "0.1.0"
description = "Research-only, multi-source crypto market data and AI analysis backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.24,<2.0", "ruff>=0.6,<1.0"]
ccxt = ["ccxt>=4.5,<5.0"]
indicators = ["TA-Lib>=0.6,<1.0"]
mcp = ["fastmcp>=2.0,<4.0"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
