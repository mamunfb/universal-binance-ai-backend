services:
  - type: web
    name: universal-binance-ai-backend
    runtime: docker
    plan: free
    region: singapore
    branch: fix/binance-public-market-data-endpoints
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PERSONAL_API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_DATABASE_URL
        value: "true"
