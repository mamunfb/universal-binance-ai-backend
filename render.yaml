services:
  - type: web
    name: universal-binance-ai-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PERSONAL_API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
